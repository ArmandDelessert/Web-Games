<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Games</title>
    <meta name="description" content="Collection de jeux web — puzzles et jeux d'adresse">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="favicon.svg">
    <style>
        :root {
            --color-bg: #fafafa;
            --color-fg: #1a1a1a;
            --color-muted: #999;
            --color-card: #ffffff;
            --color-border: #e0e0e0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #121212;
                --color-fg: #e0e0e0;
                --color-muted: #666;
                --color-card: #1e1e1e;
                --color-border: #333;
            }
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-fg);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .subtitle {
            color: var(--color-muted);
            font-size: 0.9rem;
        }

        main {
            width: min(600px, 100%);
        }

        h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .game-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem 0.8rem;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--color-fg);
            font-size: 1.05rem;
            font-weight: 500;
            transition: border-color 0.15s, background 0.15s;
        }
        .game-link:hover {
            border-color: var(--color-fg);
        }
    </style>
</head>
<body>
    <header>
        <h1>Web-Games</h1>
        <p class="subtitle">Collection de jeux web</p>
    </header>
    <main>
        <section>
            <h2>Puzzles</h2>
            <div class="game-list">
                <a class="game-link" href="Sudoku/">Sudoku</a>
                <a class="game-link" href="Yakazu/">Yakazu</a>
                <a class="game-link" href="Memory/">Memory</a>
            </div>
        </section>
        <section>
            <h2>Adresse</h2>
            <div class="game-list">
                <a class="game-link" href="Snake/">Snake</a>
                <a class="game-link" href="ZooKeeper/">ZooKeeper</a>
                <a class="game-link" href="Billard/">Billard</a>
            </div>
        </section>
    </main>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
    </script>
</body>
</html>
