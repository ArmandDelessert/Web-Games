<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Logo ADT">
	<style>
		.bg { fill: #eeeeee; }
		.label { fill: #1a1a1a; }
		@media (prefers-color-scheme: dark) {
			.bg { fill: #2a2a2a; }
			.label { fill: #e0e0e0; }
		}
	</style>
	<rect class="bg" width="100" height="100" rx="16" />
	<text class="label" x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" text-anchor="middle">ADT</text>
	<text class="label" x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" font-style="italic" text-decoration="underline" text-anchor="middle">Games</text>
</svg>