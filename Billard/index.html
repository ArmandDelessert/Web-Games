<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Billard</title>
    <meta name="description" content="Billard 8-ball en vue du dessus, style monochrome">
    <style>
        :root {
            --color-bg: #fafafa;
            --color-fg: #1a1a1a;
            --color-muted: #999;
            --color-felt: #e8e8e8;
            --color-cushion: #555;
            --color-pocket: #1a1a1a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #121212;
                --color-fg: #e0e0e0;
                --color-muted: #666;
                --color-felt: #1e1e1e;
                --color-cushion: #aaa;
                --color-pocket: #000;
            }
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-fg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
            padding: 0.5rem;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            width: min(95vw, 800px);
        }

        #info-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        #info-bar .player {
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--color-muted);
            border-radius: 4px;
            transition: border-color 0.2s, font-weight 0.2s;
        }
        #info-bar .player.active {
            border-color: var(--color-fg);
            font-weight: 700;
        }

        #canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1.1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 6px;
        }

        #power-bar {
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 40%; height: 8px;
            background: var(--color-muted);
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.15s;
        }
        #power-bar.visible { opacity: 1; }
        #power-fill {
            height: 100%;
            width: 0%;
            background: var(--color-fg);
            border-radius: 4px;
            transition: width 0.05s linear;
        }

        #message {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-bg);
            border: 2px solid var(--color-fg);
            padding: 1.2rem 2rem;
            border-radius: 8px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        #message h2 { margin-bottom: 0.5rem; font-size: 1.2rem; }
        #message button {
            margin-top: 0.6rem;
            padding: 0.4rem 1.2rem;
            background: var(--color-fg);
            color: var(--color-bg);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        #controls-hint {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--color-muted);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info-bar">
            <span id="p1" class="player active">Joueur 1</span>
            <span id="status"></span>
            <span id="p2" class="player">Joueur 2</span>
        </div>
        <div id="canvas-wrap">
            <canvas id="table"></canvas>
            <div id="power-bar"><div id="power-fill"></div></div>
            <div id="message">
                <h2 id="msg-title"></h2>
                <p id="msg-text"></p>
                <button id="btn-restart">Rejouer</button>
            </div>
        </div>
        <p id="controls-hint">Cliquer-glisser depuis la bille blanche pour viser et doser la puissance</p>
    </div>

    <script>
    (function () {
        'use strict';

        /* ── Constants ── */
        var TABLE_W = 800;
        var TABLE_H = 440;
        var CUSHION = 28;
        var POCKET_R = 18;
        var BALL_R = 10;
        var FRICTION = 0.985;
        var MIN_SPEED = 0.15;
        var MAX_POWER = 22;
        var SPIN_DAMPING = 0.98;

        /* Play area bounds (inside cushions) */
        var PX = CUSHION;
        var PY = CUSHION;
        var PW = TABLE_W - 2 * CUSHION;
        var PH = TABLE_H - 2 * CUSHION;

        /* Pocket positions (6 pockets) */
        var POCKETS = [
            { x: PX, y: PY },                          // top-left
            { x: PX + PW / 2, y: PY - 4 },            // top-center
            { x: PX + PW, y: PY },                     // top-right
            { x: PX, y: PY + PH },                     // bottom-left
            { x: PX + PW / 2, y: PY + PH + 4 },       // bottom-center
            { x: PX + PW, y: PY + PH }                 // bottom-right
        ];

        /* ── Ball setup ── */
        // Ball types: 0 = cue, 1-7 = solids, 8 = eight, 9-15 = stripes
        var BALL_STYLES = [
            { fill: '#fff', stroke: '#333', label: '' },       // 0: cue
            { fill: '#1a1a1a', stroke: '#000', label: '1' },   // 1: solid dark
            { fill: '#333', stroke: '#000', label: '2' },
            { fill: '#444', stroke: '#000', label: '3' },
            { fill: '#555', stroke: '#000', label: '4' },
            { fill: '#666', stroke: '#111', label: '5' },
            { fill: '#777', stroke: '#222', label: '6' },
            { fill: '#888', stroke: '#333', label: '7' },
            { fill: '#1a1a1a', stroke: '#fff', label: '8' },   // 8: eight ball
            { fill: '#aaa', stroke: '#555', label: '9' },      // 9-15: stripes (lighter)
            { fill: '#bbb', stroke: '#666', label: '10' },
            { fill: '#ccc', stroke: '#777', label: '11' },
            { fill: '#ddd', stroke: '#888', label: '12' },
            { fill: '#eee', stroke: '#999', label: '13' },
            { fill: '#f5f5f5', stroke: '#aaa', label: '14' },
            { fill: '#fafafa', stroke: '#bbb', label: '15' }
        ];

        /* ── State ── */
        var canvas = document.getElementById('table');
        var ctx = canvas.getContext('2d');
        var powerBar = document.getElementById('power-bar');
        var powerFill = document.getElementById('power-fill');
        var messageEl = document.getElementById('message');
        var msgTitle = document.getElementById('msg-title');
        var msgText = document.getElementById('msg-text');
        var btnRestart = document.getElementById('btn-restart');
        var statusEl = document.getElementById('status');
        var p1El = document.getElementById('p1');
        var p2El = document.getElementById('p2');

        var balls = [];
        var pottedSolids = 0;
        var pottedStripes = 0;
        var currentPlayer = 1; // 1 or 2
        var playerGroups = { 1: null, 2: null }; // 'solid' or 'stripe'
        var turnPotted = [];   // balls potted this turn
        var foul = false;
        var gameOver = false;
        var aiming = false;
        var aimStart = null;
        var aimEnd = null;
        var animating = false;
        var scale = 1;

        /* ── Initialization ── */
        function initBalls() {
            balls = [];
            // Cue ball
            balls.push({ id: 0, x: PX + PW * 0.25, y: PY + PH / 2, vx: 0, vy: 0, potted: false });

            // Rack position (triangle)
            var rackX = PX + PW * 0.72;
            var rackY = PY + PH / 2;
            var spacing = BALL_R * 2.15;

            // Standard 8-ball rack order (8 in center)
            var rackOrder = [1, 9, 2, 10, 8, 11, 3, 12, 4, 13, 5, 14, 6, 15, 7];
            var idx = 0;
            for (var row = 0; row < 5; row++) {
                for (var col = 0; col <= row; col++) {
                    var bx = rackX + row * spacing * Math.cos(Math.PI / 6);
                    var by = rackY + (col - row / 2) * spacing;
                    balls.push({
                        id: rackOrder[idx],
                        x: bx,
                        y: by,
                        vx: 0,
                        vy: 0,
                        potted: false
                    });
                    idx++;
                }
            }
        }

        function resetGame() {
            initBalls();
            pottedSolids = 0;
            pottedStripes = 0;
            currentPlayer = 1;
            playerGroups = { 1: null, 2: null };
            turnPotted = [];
            foul = false;
            gameOver = false;
            aiming = false;
            animating = false;
            messageEl.style.display = 'none';
            updateUI();
            draw();
        }

        /* ── Physics ── */
        function step() {
            var moving = false;
            for (var i = 0; i < balls.length; i++) {
                var b = balls[i];
                if (b.potted) continue;
                if (Math.abs(b.vx) < MIN_SPEED && Math.abs(b.vy) < MIN_SPEED) {
                    b.vx = 0; b.vy = 0;
                    continue;
                }
                moving = true;
                b.x += b.vx;
                b.y += b.vy;
                b.vx *= FRICTION;
                b.vy *= FRICTION;

                // Cushion collisions
                if (b.x - BALL_R < PX) { b.x = PX + BALL_R; b.vx = -b.vx * 0.8; }
                if (b.x + BALL_R > PX + PW) { b.x = PX + PW - BALL_R; b.vx = -b.vx * 0.8; }
                if (b.y - BALL_R < PY) { b.y = PY + BALL_R; b.vy = -b.vy * 0.8; }
                if (b.y + BALL_R > PY + PH) { b.y = PY + PH - BALL_R; b.vy = -b.vy * 0.8; }
            }

            // Ball-ball collisions
            for (var i = 0; i < balls.length; i++) {
                var a = balls[i];
                if (a.potted) continue;
                for (var j = i + 1; j < balls.length; j++) {
                    var b2 = balls[j];
                    if (b2.potted) continue;
                    resolveBallCollision(a, b2);
                }
            }

            // Pocket check
            for (var i = 0; i < balls.length; i++) {
                var b3 = balls[i];
                if (b3.potted) continue;
                for (var p = 0; p < POCKETS.length; p++) {
                    var dx = b3.x - POCKETS[p].x;
                    var dy = b3.y - POCKETS[p].y;
                    if (dx * dx + dy * dy < (POCKET_R - 2) * (POCKET_R - 2)) {
                        b3.potted = true;
                        b3.vx = 0; b3.vy = 0;
                        turnPotted.push(b3.id);
                        break;
                    }
                }
            }

            return moving;
        }

        function resolveBallCollision(a, b) {
            var dx = b.x - a.x;
            var dy = b.y - a.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var minDist = BALL_R * 2;
            if (dist >= minDist || dist === 0) return;

            // Normalize
            var nx = dx / dist;
            var ny = dy / dist;

            // Separate overlapping balls
            var overlap = minDist - dist;
            a.x -= nx * overlap / 2;
            a.y -= ny * overlap / 2;
            b.x += nx * overlap / 2;
            b.y += ny * overlap / 2;

            // Relative velocity along collision normal
            var dvx = a.vx - b.vx;
            var dvy = a.vy - b.vy;
            var dvn = dvx * nx + dvy * ny;
            if (dvn <= 0) return; // moving apart

            // Equal mass elastic collision
            a.vx -= dvn * nx;
            a.vy -= dvn * ny;
            b.vx += dvn * nx;
            b.vy += dvn * ny;
        }

        /* ── Turn logic ── */
        function placeCueBall() {
            var cue = balls[0];
            // Try positions behind the head line
            var hx = PX + PW * 0.25;
            var tryX = [hx, hx - BALL_R * 4, hx - BALL_R * 8, PX + BALL_R * 2];
            for (var xi = 0; xi < tryX.length; xi++) {
                cue.x = tryX[xi];
                cue.y = PY + PH / 2;
                if (!overlapsAny(cue)) return;
                // Try vertical offsets
                for (var dy = BALL_R * 3; dy < PH / 2; dy += BALL_R * 3) {
                    cue.y = PY + PH / 2 + dy;
                    if (!overlapsAny(cue)) return;
                    cue.y = PY + PH / 2 - dy;
                    if (!overlapsAny(cue)) return;
                }
            }
            // Fallback: center of play area
            cue.x = PX + PW / 2;
            cue.y = PY + PH / 2;
        }

        function overlapsAny(cue) {
            for (var i = 1; i < balls.length; i++) {
                if (balls[i].potted) continue;
                var dx = cue.x - balls[i].x;
                var dy = cue.y - balls[i].y;
                if (dx * dx + dy * dy < (BALL_R * 2.5) * (BALL_R * 2.5)) return true;
            }
            return false;
        }

        function endTurn() {
            var cueBall = balls[0];

            // Check if cue ball was potted (foul)
            if (cueBall.potted) {
                foul = true;
                cueBall.potted = false;
                cueBall.vx = 0; cueBall.vy = 0;
                // Place cue ball behind the head line, avoiding overlaps
                placeCueBall();
            }

            // Check 8-ball potted
            var eightPotted = turnPotted.indexOf(8) >= 0;
            if (eightPotted) {
                var playerGroup = playerGroups[currentPlayer];
                var remaining = countRemaining(playerGroup);
                if (remaining === 0 && !foul) {
                    showMessage('Joueur ' + currentPlayer + ' gagne !', 'La bille 8 est empochee.');
                } else {
                    var other = currentPlayer === 1 ? 2 : 1;
                    showMessage('Joueur ' + other + ' gagne !', 'Bille 8 empochee trop tot ou sur faute.');
                }
                gameOver = true;
                turnPotted = [];
                return;
            }

            // Assign groups on first pot (excluding 8)
            if (!playerGroups[1] && turnPotted.length > 0) {
                var first = null;
                for (var i = 0; i < turnPotted.length; i++) {
                    if (turnPotted[i] !== 0 && turnPotted[i] !== 8) {
                        first = turnPotted[i];
                        break;
                    }
                }
                if (first !== null) {
                    if (first <= 7) {
                        playerGroups[currentPlayer] = 'solid';
                        playerGroups[currentPlayer === 1 ? 2 : 1] = 'stripe';
                    } else {
                        playerGroups[currentPlayer] = 'stripe';
                        playerGroups[currentPlayer === 1 ? 2 : 1] = 'solid';
                    }
                }
            }

            // Count potted in player's group
            var pottedOwn = 0;
            var playerGroup2 = playerGroups[currentPlayer];
            for (var i = 0; i < turnPotted.length; i++) {
                var bid = turnPotted[i];
                if (bid === 0 || bid === 8) continue;
                if (playerGroup2 === 'solid' && bid <= 7) pottedOwn++;
                else if (playerGroup2 === 'stripe' && bid >= 9) pottedOwn++;
            }

            // Update counters
            for (var i = 0; i < turnPotted.length; i++) {
                var bid2 = turnPotted[i];
                if (bid2 >= 1 && bid2 <= 7) pottedSolids++;
                else if (bid2 >= 9 && bid2 <= 15) pottedStripes++;
            }

            // Switch turn if foul or no own ball potted
            if (foul || pottedOwn === 0) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
            }

            foul = false;
            turnPotted = [];
            updateUI();
        }

        function countRemaining(group) {
            if (!group) return 99;
            var count = 0;
            for (var i = 1; i < balls.length; i++) {
                if (balls[i].potted) continue;
                if (group === 'solid' && balls[i].id >= 1 && balls[i].id <= 7) count++;
                else if (group === 'stripe' && balls[i].id >= 9 && balls[i].id <= 15) count++;
            }
            return count;
        }

        function updateUI() {
            p1El.classList.toggle('active', currentPlayer === 1);
            p2El.classList.toggle('active', currentPlayer === 2);
            var g1 = playerGroups[1];
            var g2 = playerGroups[2];
            p1El.textContent = 'J1' + (g1 ? (g1 === 'solid' ? ' (pleines)' : ' (rayees)') : '');
            p2El.textContent = 'J2' + (g2 ? (g2 === 'solid' ? ' (pleines)' : ' (rayees)') : '');
            var rem = countRemaining(playerGroups[currentPlayer]);
            if (playerGroups[currentPlayer]) {
                statusEl.textContent = rem === 0 ? 'Bille 8 !' : rem + ' restante' + (rem > 1 ? 's' : '');
            } else {
                statusEl.textContent = '';
            }
        }

        function showMessage(title, text) {
            msgTitle.textContent = title;
            msgText.textContent = text;
            messageEl.style.display = 'block';
        }

        /* ── Drawing ── */
        function draw() {
            var w = canvas.width;
            var h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // Table felt
            ctx.fillStyle = getCSS('--color-felt');
            ctx.fillRect(0, 0, w, h);

            // Cushions
            ctx.fillStyle = getCSS('--color-cushion');
            ctx.fillRect(0, 0, w, CUSHION);
            ctx.fillRect(0, h - CUSHION, w, CUSHION);
            ctx.fillRect(0, 0, CUSHION, h);
            ctx.fillRect(w - CUSHION, 0, CUSHION, h);

            // Play area border
            ctx.strokeStyle = getCSS('--color-fg');
            ctx.lineWidth = 1.5;
            ctx.strokeRect(PX, PY, PW, PH);

            // Pockets
            ctx.fillStyle = getCSS('--color-pocket');
            for (var i = 0; i < POCKETS.length; i++) {
                ctx.beginPath();
                ctx.arc(POCKETS[i].x, POCKETS[i].y, POCKET_R, 0, Math.PI * 2);
                ctx.fill();
            }

            // Head line (quarter line)
            ctx.strokeStyle = getCSS('--color-muted');
            ctx.lineWidth = 0.5;
            ctx.setLineDash([4, 4]);
            var hx = PX + PW * 0.25;
            ctx.beginPath();
            ctx.moveTo(hx, PY);
            ctx.lineTo(hx, PY + PH);
            ctx.stroke();
            ctx.setLineDash([]);

            // Balls
            for (var i = 0; i < balls.length; i++) {
                var b = balls[i];
                if (b.potted) continue;
                drawBall(b);
            }

            // Aim line
            if (aiming && aimStart && aimEnd) {
                var cue = balls[0];
                var dx = aimStart.x - aimEnd.x;
                var dy = aimStart.y - aimEnd.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 3) {
                    var nx = dx / dist;
                    var ny = dy / dist;
                    ctx.strokeStyle = getCSS('--color-fg');
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(cue.x, cue.y);
                    ctx.lineTo(cue.x + nx * 150, cue.y + ny * 150);
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;

                    // Cue stick (behind ball)
                    var cueLen = Math.min(dist * 0.8, 120);
                    ctx.strokeStyle = getCSS('--color-fg');
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(cue.x - nx * (BALL_R + 4), cue.y - ny * (BALL_R + 4));
                    ctx.lineTo(cue.x - nx * (BALL_R + 4 + cueLen), cue.y - ny * (BALL_R + 4 + cueLen));
                    ctx.stroke();
                    ctx.lineCap = 'butt';
                }
            }
        }

        function drawBall(b) {
            var s = BALL_STYLES[b.id];
            var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            ctx.beginPath();
            ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);

            if (b.id === 0) {
                // Cue ball: white in light mode, light gray in dark mode
                ctx.fillStyle = isDark ? '#ccc' : '#fff';
                ctx.fill();
                ctx.strokeStyle = isDark ? '#888' : '#333';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            } else if (b.id === 8) {
                // Eight ball: always dark with white text
                ctx.fillStyle = isDark ? '#222' : '#1a1a1a';
                ctx.fill();
                ctx.strokeStyle = isDark ? '#666' : '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
            } else if (b.id <= 7) {
                // Solids: dark shades
                var shade = isDark ? (40 + b.id * 12) : (20 + b.id * 15);
                ctx.fillStyle = 'rgb(' + shade + ',' + shade + ',' + shade + ')';
                ctx.fill();
                ctx.strokeStyle = isDark ? '#555' : '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
            } else {
                // Stripes: lighter with a band
                var base = isDark ? '#aaa' : '#eee';
                ctx.fillStyle = base;
                ctx.fill();
                // Stripe band
                ctx.save();
                ctx.beginPath();
                ctx.rect(b.x - BALL_R, b.y - BALL_R * 0.4, BALL_R * 2, BALL_R * 0.8);
                ctx.clip();
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
                var bandShade = isDark ? (50 + (b.id - 9) * 10) : (30 + (b.id - 9) * 12);
                ctx.fillStyle = 'rgb(' + bandShade + ',' + bandShade + ',' + bandShade + ')';
                ctx.fill();
                ctx.restore();
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
                ctx.strokeStyle = isDark ? '#666' : '#999';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Label
            if (b.id > 0) {
                var label = String(b.id);
                ctx.fillStyle = (b.id <= 8) ? '#fff' : (isDark ? '#222' : '#333');
                ctx.font = 'bold ' + (BALL_R * 0.9) + 'px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, b.x, b.y + 0.5);
            }
        }

        function getCSS(prop) {
            return getComputedStyle(document.documentElement).getPropertyValue(prop).trim();
        }

        /* ── Animation loop ── */
        function animate() {
            if (!animating) return;
            var moving = step();
            draw();
            if (moving) {
                requestAnimationFrame(animate);
            } else {
                animating = false;
                endTurn();
                draw();
            }
        }

        /* ── Input handling ── */
        function getCanvasPos(e) {
            var rect = canvas.getBoundingClientRect();
            var scaleX = TABLE_W / rect.width;
            var scaleY = TABLE_H / rect.height;
            var clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function onDown(e) {
            if (animating || gameOver) return;
            var pos = getCanvasPos(e);
            var cue = balls[0];
            var dx = pos.x - cue.x;
            var dy = pos.y - cue.y;
            // Allow aiming from a generous zone around the cue ball
            if (dx * dx + dy * dy < (BALL_R * 5) * (BALL_R * 5)) {
                aiming = true;
                aimStart = { x: cue.x, y: cue.y };
                aimEnd = pos;
                powerBar.classList.add('visible');
                e.preventDefault();
            }
        }

        function onMove(e) {
            if (!aiming) return;
            aimEnd = getCanvasPos(e);
            var dx = aimStart.x - aimEnd.x;
            var dy = aimStart.y - aimEnd.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var pct = Math.min(dist / 200, 1) * 100;
            powerFill.style.width = pct + '%';
            draw();
            e.preventDefault();
        }

        function onUp(e) {
            if (!aiming) return;
            aiming = false;
            powerBar.classList.remove('visible');
            powerFill.style.width = '0%';

            if (!aimEnd) return;
            var dx = aimStart.x - aimEnd.x;
            var dy = aimStart.y - aimEnd.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 10) { draw(); return; }

            var power = Math.min(dist / 200, 1) * MAX_POWER;
            var nx = dx / dist;
            var ny = dy / dist;
            var cue = balls[0];
            cue.vx = nx * power;
            cue.vy = ny * power;

            turnPotted = [];
            foul = false;
            animating = true;
            requestAnimationFrame(animate);
        }

        /* ── Setup ── */
        function resize() {
            canvas.width = TABLE_W;
            canvas.height = TABLE_H;
            draw();
        }

        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onUp);
        canvas.addEventListener('mouseleave', onUp);
        canvas.addEventListener('touchstart', onDown, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onUp);

        btnRestart.addEventListener('click', resetGame);

        window.addEventListener('resize', function () { draw(); });

        resize();
        resetGame();
    })();
    </script>
</body>
</html>
